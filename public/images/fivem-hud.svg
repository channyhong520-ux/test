<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <!-- Health bar -->
  <rect x="60" y="450" width="200" height="12" rx="6" fill="#1e293b"/>
  <rect x="60" y="450" width="160" height="12" rx="6" fill="#ef4444"/>
  <text x="60" y="440" font-family="monospace" font-size="14" fill="#94a3b8">HP</text>
  <!-- Armor bar -->
  <rect x="60" y="480" width="200" height="12" rx="6" fill="#1e293b"/>
  <rect x="60" y="480" width="120" height="12" rx="6" fill="#3b82f6"/>
  <text x="60" y="470" font-family="monospace" font-size="14" fill="#94a3b8">ARMOR</text>
  <!-- Speedometer -->
  <circle cx="1060" cy="480" r="80" fill="none" stroke="#1e293b" stroke-width="8"/>
  <circle cx="1060" cy="480" r="80" fill="none" stroke="#06b6d4" stroke-width="8" stroke-dasharray="350 502" stroke-linecap="round" transform="rotate(-90 1060 480)"/>
  <text x="1060" y="475" font-family="monospace" font-size="32" fill="#fff" text-anchor="middle">138</text>
  <text x="1060" y="500" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">km/h</text>
  <!-- Fuel -->
  <rect x="940" y="570" width="240" height="8" rx="4" fill="#1e293b"/>
  <rect x="940" y="570" width="180" height="8" rx="4" fill="#f59e0b"/>
  <text x="940" y="564" font-family="monospace" font-size="12" fill="#94a3b8">FUEL 75%</text>
  <!-- Title -->
  <text x="600" y="180" font-family="sans-serif" font-size="64" font-weight="bold" fill="#fff" text-anchor="middle">FiveM HUD</text>
  <text x="600" y="220" font-family="sans-serif" font-size="22" fill="#818cf8" text-anchor="middle">Custom Roleplay Interface</text>
  <!-- Icons -->
  <rect x="500" y="300" width="200" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="326" font-family="monospace" font-size="16" fill="#06b6d4" text-anchor="middle">ESX | QBCore</text>
</svg>
